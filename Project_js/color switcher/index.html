<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color-switcher-project</title>
    <strong>
        <link rel="stylesheet" href="./style.css">
    </strong>
</head>

<body>

    <div class="contianer">
        <h1 class="heading">Color Switcher</h1>
        <div class="inputBtnContainer">
            <button class="randomBtn">Rondom Color</button>
            <input id="colorInput" type="text" placeholder="Enter a color or hex (e.g red or #ffffff)">
            <button class="applyBtn">Apply Color</button>
        </div>
        <h1 class="currentColor">Current Color: <span class="currentColorValue">rgb(209, 204, 198)</span></h1>
    </div>


    <script src="./script.js"></script>
</body>

</html>
