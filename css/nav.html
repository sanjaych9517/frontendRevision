<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAV-BAR</title>

    <style>

        ul{
            background-color: black;
            overflow: auto;
            padding: 15px;
        }
        li{
            float: left;
            color: white;
            list-style: none;
        }
        a{
            text-decoration: none;
            color: white;
            margin-left: 20px;
        }
        .center{
            margin-left: 35%;
        }

        .contact{
            float: right;
            margin-right: 35px;
            height: 20px;
            width: 100px;
            padding: 10px 0;
            background-color: aquamarine;
            border-radius: 20px;
        
        }

    </style>
</head>
<body>
   <ul>
         <li><a href="#">LOGOBARKEY</a></li>
         <li class="center"><a href="#">Service</a></li>
         <li><a href="#">Project</a></li>
         <li><a href="#">About</a></li>
         <li class="contact"><a href="#">Contact</a></li>
   </ul>
    
</body>
</html>
