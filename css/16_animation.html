<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      .box {
        height: 150px;
        width: 150px;
        border: 1px solid black;
        background-color: rgb(225, 11, 11);
        border-radius: 50%;
        /* margin-left: 200px; */
        animation: boll 1s linear infinite alternate;
        position: relative;
      }

      @keyframes boll {
        0% {
          top: 0px;
        }

        100% {
          top: 400px;
        }
      }
    </style>
  </head>
  <body>
    <div class="box"></div>
  </body>
</html>
