<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <table>
      <form action="">
        <tr>
          <th colspan="3">Novell Services Login</th>
          <th><br /><br /><br /><br /></th>
        </tr>
        <tr>
          <td><label for="username">Username</label></td>
          <td><input type="text" id="username" maxlength="20" /></td>
        </tr>

        <tr>
          <td><label for="pass">Password</label></td>
          <td><input type="password" id="pass" maxlength="10" /></td>
        </tr>

        <tr>
          <td><label for="city">City of</label></td>
          <td><input type="text" id="city" /></td>
        </tr>

        <tr>
          <td><label for="emp">Empolyment</label></td>
          <td><input type="number" min="0"  id="emp"/></td>
        </tr>

        <tr>
          <td><label for="">Web server</label></td>
          <td>
            <select name="" id="">
              <option value="">-- Chose a server -- &nbsp;</option>
              <option value="">server1</option>
              <option value="">server2</option>
              <option value="">server3</option>
              <option value="">server4</option>
            </select>
          </td>
        </tr>

        <tr>
          <td><br /><br /></td>
        </tr>

        <tr>
          <td rowspan="5">
            <label for=""
              >Please specify <br />
              your role</label
            >
          </td>
        </tr>

        <tr>
          <td>
            <input type="radio" name="role" />
            <label for="">Admin</label>
          </td>
        </tr>
        <tr>
          <td>
            <input type="radio" name="role" /><label for="">Enginer</label>
          </td>
        </tr>
        <tr>
          <td>
            <input type="radio" name="role" /><label for="">Manager</label>
          </td>
        </tr>
        <tr>
          <td><input type="radio" name="role" /><label for="">Guest</label></td>
        </tr>

        <tr>
          <td><br /><br /></td>
        </tr>

        <tr>
          <td rowspan="4">
            <label for=""
              >Single sign on <br />
              to the following</label
            >
          </td>
        </tr>

        <tr>
          <td><input type="checkbox" /><label for="">Mail</label></td>
        </tr>
        <tr>
          <td><input type="checkbox" /><label for="">Pray oll</label></td>
        </tr>
        <tr>
          <td><input type="checkbox" /><label for="">Self-service</label></td>
        </tr>

        <tr>
          <td></td>
          <td>
            <button type="submit">Login</button>&nbsp;<button type="submit">
              Login
            </button>
          </td>
        </tr>
      </form>
    </table>
  </body>
</html>
