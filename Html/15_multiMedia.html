<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Introduction to Multimedia in html</h1>
    <h2>Add Image</h2>
    <h3>Image from same folder</h3>
    <img src="../Html/image1.jpg" alt="nature1" height="200px" width="250px" />

    <h3>Image from another folder</h3>
    <img
      src="../images/image2.jpg"
      alt="nature2"
      height="200px"
      width="250px"
    />

    <h3>image from browser</h3>
    <img
      src="https://thumbs.dreamstime.com/b/beautiful-rain-forest-ang-ka-nature-trail-doi-inthanon-national-park-thailand-44947671.jpg"
      alt=""
      height="200px"
      width="250px"
    />

    <!-- try to avoid image from pc -->
    <h4>image from pc</h4>
    <img
      src="C:\Users\SANJAY CHAUDHARY\Pictures\Screenshots\Screenshot 2025-02-25 203109.png"
      alt=""
      height="200px"
      width="250px"
    />

    <!-- video:: controls -->
    <video src="" height="400px" width="600px"></video>

    <!-- audio: controls -->
    <audio src=""></audio>
    <!-- pdf embed tag -->
    <embed src="" type="" />

    <!-- youtube video -->
    <!-- you tube -> select a video -> share -> copy embed -> copy complete iframe tag -> paste in vs code -->

    <iframe
      width="560"
      height="315"
      src="https://www.youtube.com/embed/anzvNiTRHVA?si=mFw-T7xKZ2lIyqV2"
      title="YouTube video player"
      frameborder="0"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share;
      "
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>

    you-tube -->
  </body>
</html>
