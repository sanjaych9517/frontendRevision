<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body> 
    <h1>Registration Form</h1>
   <form action="../Html/19_registration form.html">
     <label for="fname"><b>First Name :</b></label>
    <input type="text" id="fname" placeholder="Enter First name"> <br>


     <label for="lname"><b>Last Name :</b></label>
    <input type="text" id="lname" placeholder="Enter Last name"> <br>

    <label for="email"><b>Email :</b></label>
    <input type="email" id="email" placeholder="Enter Email Address"> <br>

    <label for="pass"><b>Password :</b></label>
    <input type="password" id="pass" > <br>

    <b>Gender:</b><br>
    <label for="male"><b>Male</b></label>
    <input type="radio" id="male" name="gen"><br>

    <label for="female"><b>Female</b></label>
    <input type="radio" id="female" name="gen"><br>

    <label for="other"><b>Other</b></label>
    <input type="radio" id="other" name="gen"><br>

    <label for="age"><b>Age :</b></label>
    <input type="number" min="1" id="age" > <br>
     
    <b>Preferences :</b><br>
    <label for="srcylic"><b>Acrylic Painting</b></label>
    <input type="checkbox" name="" id="srcylic"><br>

    <label for="Oil"><b>Oil Painting</b></label>
    <input type="checkbox" name="" id="Oil"><br>

    <label for="Water"><b>Water color Painting</b></label>
    <input type="checkbox" name="" id="Water"><br>
     
    <label for="select"><b>Select Occupation</b></label>
    <select name="" id="select">
        <option value="">Student &nbsp; &nbsp; &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</option> <br>
    </select><br>

       &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <textarea name="" id="" placeholder="share few lines about yourself...."></textarea><br>
       <label for=""><b>Bio</b></label><br>

       <button type="reset">RESET</button>
       <button type="submit"">SUBMIT</button>

   </form>


</body>
</html>
