<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
        integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>
    <!-- Header -->
    <header class="navbar">
        <div class="logo">
            <h1>Netflix</h1>
        </div>
        <div class="nav-button">
            <div class="language ">
                <select name="" id="">
                    <option value="">English</option>
                    <option value="">Hindi</option>
                </select>
            </div>
            <div class="signIn">SignIn </div>
        </div>
    </header>

    <main class="hero">
        <img src="./Image/bgimg.png" alt="" class="mainImg">

        <div class="hero-container">
            <h1>Unlimited movies, shows, and more</h1>
            <p class="firstpara">Starts at ₹149. Cancel at any time.</p>
            <p class="secondpara">Ready to watch? Enter your email to create or restart your membership.</p>



            <div class="emailGroup">
                <input type="Email" id="email" placeholder="Enter Email">
                <label for="email" class="getStarted">Get Started  &gt;</label>
            </div>
    </main>
 
   


</body>

</html>
