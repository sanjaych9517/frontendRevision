<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <p class="para">Lorem ipsum dolor sit, amet consectetur adipisicing elit. At ipsum error hic aliquam laboriosam
        perferendis suscipit ipsam praesentium nobis expedita impedit, blanditiis eius, libero quod unde adipisci minima
        consequuntur aut.</p>
    <button class="btn">hide</button>

    <script>
        let btn = document.querySelector(".btn")
        let para = document.querySelector(".para")

        btn.addEventListener("click", () => {
            para.style.visibility = "hidden"
        })
    </script>
</body>

</html>
